name: release

# 发版：推一个 v* tag，这里自动构建 release 包并发出 GitHub Release。
#   git tag -a v1.0.2 -m "v1.0.2" && git push origin main && git push origin v1.0.2
#
# 更新日志约定：docs/releases/<tag>.md（例如 docs/releases/v1.0.2.md），一份文件双语，
# 英文在上、中文在下。文件不存在时退回 GitHub 自动生成的 notes（按 commit 归类）。
#
# 签名：仓库 Secrets 里必须有 KEYSTORE_B64 / STORE_PASSWORD / KEY_PASSWORD 三项。
# 密钥文件本体在本地 D:/Harrison/keystores/openapk-tv/（不进库），丢了就再也发不了覆盖安装的包。
on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

# 同一个 tag 不并发；已排队的不取消，避免传到一半的 Release 变成半成品
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不用 android-actions/setup-android：它 2026-11-28 起连续多次在 runner 上失败。
      # 注意包名：compileSdk 37 对应的 platform 包叫 platforms;android-37.0（不是 android-37），
      # 老写法会报 "Failed to find package"。
      - name: 准备 Android SDK 组件
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "runner 上没有 SDK，临时装一份 cmdline-tools"
            SDK="$RUNNER_TEMP/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          echo "SDK=$SDK  sdkmanager=$SDKM"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDKM" --sdk_root="$SDK" "platforms;android-37.0" "platform-tools" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/36.0.0" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4

      # tag 与 build.gradle.kts 的版本号必须一致，否则发出去的包版本对不上 tag
      - name: 校验版本号
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "versionName = \"$VERSION\"" app/build.gradle.kts \
            || { echo "::error::tag $GITHUB_REF_NAME 与 app/build.gradle.kts 的 versionName 不一致"; exit 1; }
          echo "版本号一致：$VERSION"

      # 签名必须固定：runner 每次的 debug.keystore 都是新的，靠它签出来的包彼此不能覆盖安装
      - name: 配置发布密钥
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${STORE_PASSWORD:-}" ]; then
            echo "::error::缺少 KEYSTORE_B64 / STORE_PASSWORD / KEY_PASSWORD secrets，拒绝用临时 debug 密钥发版"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "openapk-tv" "$KEY_PASSWORD" > keystore.properties

      - name: 构建 release 包
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # 防止配置没生效时静默用 debug 签名发出去
      - name: 核对签名
        run: |
          set -euo pipefail
          EXPECTED="b1c546982a32524325cd691ec5d8b386244b2d933eeb524f4dfa2d27b11d7183"
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)
          GOT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
                | grep -i "SHA-256 digest" | awk '{print tolower($NF)}' | tr -d ':')
          echo "APK 签名证书：$GOT"
          [ "$GOT" = "$EXPECTED" ] || { echo "::error::签名指纹不符，检查 KEYSTORE_B64"; exit 1; }

      - name: 整理产物
        id: pack
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APK="openapk-tv-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # 用 action 而不是 gh CLI：create / 已存在时覆盖附件这两条路径都由它处理，
      # 也免得自己拼 idempotent 逻辑（gh 版在 2026-11-28 连续失败且拿不到日志）。
      - name: 发布 Release
        id: pub
        uses: softprops/action-gh-release@v2
        with:
          name: OpenAPK TV ${{ steps.pack.outputs.version }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            ${{ steps.pack.outputs.apk }}
            ${{ steps.pack.outputs.apk }}.sha256
          draft: false
          make_latest: true
          fail_on_unmatched_files: true

      # 发布失败时把原因贴成 commit comment，公共仓库不用登录就能看到（Actions 日志要鉴权）
      - name: 贴出失败原因
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(printf 'release 发布失败（run %s）\n\n```\n%s\n```' \
            "$GITHUB_RUN_ID" "$(tail -c 2000 "$RUNNER_TEMP/publish.log" 2>/dev/null || echo '无日志')")
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$BODY" || true

      - name: 摘要
        run: |
          {
            echo "### OpenAPK TV ${{ steps.pack.outputs.version }}"
            echo
            echo "- 附件：\`${{ steps.pack.outputs.apk }}\` + \`.sha256\`"
            echo "- Release：https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
            echo
            echo "签名不变的情况下可直接覆盖安装；改了签名需先卸载。"
          } >> "$GITHUB_STEP_SUMMARY"
